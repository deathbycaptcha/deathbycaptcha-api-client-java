name: Integration API Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  integration-tests:
    name: Integration API Tests (Java 25)
    runs-on: ubuntu-latest

    env:
      DBC_USERNAME: ${{ secrets.DBC_USERNAME }}
      DBC_PASSWORD: ${{ secrets.DBC_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run integration API tests
        run: mvn --batch-mode --errors --fail-at-end --show-version -Djava.release=25 -Dtest=OnlineGitBasicApiIntegrationTest test

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-api-test-results
          path: target/surefire-reports/

  playwright-integration-tests:
    name: Playwright Integration Tests (Java 21)
    runs-on: ubuntu-latest

    env:
      DBC_USERNAME: ${{ secrets.DBC_USERNAME }}
      DBC_PASSWORD: ${{ secrets.DBC_PASSWORD }}
      DBC_AUTHTOKEN: ${{ secrets.DBC_AUTHTOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Playwright browsers
        run: |
          mvn --batch-mode --errors --fail-at-end --show-version -Djava.release=21 dependency:resolve
          mvn --batch-mode exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run Playwright integration test
        run: |
          mvn --batch-mode --errors --fail-at-end --show-version -Djava.release=21 -Dtest=OnlinePlaywrightRecaptchaIntegrationTest test

      - name: Print Surefire reports on failure
        if: failure()
        run: |
          echo "==== surefire text reports ===="
          find target/surefire-reports -name "*.txt" -maxdepth 1 -print -exec cat {} \;
          echo "==== surefire xml reports ===="
          find target/surefire-reports -name "*.xml" -maxdepth 1 -print -exec sed -n '1,220p' {} \;

      - name: Upload Playwright integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-test-results
          path: target/surefire-reports/
